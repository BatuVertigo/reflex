<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<link rel="icon" href="<!--LOGO-->">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #0f141b;
  --ink-2: #5b6573;
  --ink-3: #8a94a3;
  --hairline: #e3e7ee;
  --focus: #2a78d6;
  --live: #1f9d55;
  --past: #3b82f6;
  --test: #b7791f;
  --android: #3ddc84;
  --accent: #4a3aa7;
  --font-display: "Archivo", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0e12; --surface: #141920; --surface-2: #1a2029; --ink: #eef1f5; --ink-2: #aab3c0; --ink-3: #6f7a88;
    --hairline: #242b35; --focus: #3987e5; --live: #34c272; --past: #60a5fa; --test: #e0a94a; --accent: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0b0e12; --surface: #141920; --surface-2: #1a2029; --ink: #eef1f5; --ink-2: #aab3c0; --ink-3: #6f7a88;
  --hairline: #242b35; --focus: #3987e5; --live: #34c272; --past: #60a5fa; --test: #e0a94a; --accent: #9085e9;
}
body[data-game="cs"] { --accent: #9a6b00; }
@media (prefers-color-scheme: dark) { body[data-game="cs"] { --accent: #e8b53c; } }

* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; padding: 28px 20px 56px; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
main { width: min(1180px, 100%); margin: 0 auto; }

header { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
/* The logo is the switch to the other game's table, like the Stats pages: hover shows the arrows. */
a.brand { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; padding: 4px 10px 4px 4px; border-radius: 16px; transition: background 120ms ease; }
a.brand:hover { background: var(--surface); }
a.brand:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.brand img { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; box-shadow: 0 1px 2px rgba(15, 20, 27, 0.12); }
.brand-swap { font-size: 22px; line-height: 1; color: var(--ink-3); align-self: center; }
a.brand:hover .brand-swap { color: var(--accent); }
header .eyebrow { margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
header h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-stretch: 62%; font-variation-settings: "wdth" 62; font-size: 40px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
header .meta { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; }
header .meta strong { color: var(--ink); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 14px 22px; margin: 0 0 14px; padding: 0 4px; color: var(--ink-2); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: 0 1px 2px rgba(15, 20, 27, 0.05), 0 12px 32px -24px rgba(15, 20, 27, 0.25); overflow: hidden; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
thead th { white-space: nowrap; position: sticky; top: 0; background: var(--surface-2); padding: 12px 16px; text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--hairline); }
tbody td { padding: 12px 16px; vertical-align: top; border-bottom: 1px solid var(--hairline); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td:nth-child(1) { white-space: nowrap; }
td:nth-child(1) a { color: var(--ink); font-weight: 700; text-decoration: none; border-bottom: 1px solid transparent; }
td:nth-child(1) a:hover { color: var(--focus); border-bottom-color: var(--focus); }
td:nth-child(2) { font-family: var(--font-mono); font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--ink-2); }
td:nth-child(3) { color: var(--ink-2); font-size: 13.5px; white-space: nowrap; }
td:nth-child(4) { font-weight: 500; }
td strong { font-weight: 700; }
td a { color: var(--focus); }

.os { width: 14px; height: 14px; vertical-align: -2px; margin-right: 1px; }
.os.apple { fill: var(--ink); }
.os.android { fill: var(--android); }
.os + .os { margin-left: 3px; }
.dot { display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; vertical-align: 0; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); }
.dot.live { background: var(--live); color: var(--live); }
.dot.past { background: var(--past); color: var(--past); }
.flask { width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px; fill: none; stroke: var(--test); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ext { width: 11px; height: 11px; margin-left: 4px; vertical-align: 1px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
td:nth-child(1) a:hover .ext { opacity: 1; }

@media (max-width: 720px) {
  body { padding: 18px 12px 40px; font-size: 13.5px; }
  header { gap: 12px; } .brand img { width: 48px; height: 48px; } header h1 { font-size: 30px; }
  thead th, tbody td { padding: 10px 12px; }
}
</style>
</head>
<body data-game="<!--KEY-->">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="icon-apple" viewBox="0 0 24 24"><path d="<!--APPLE-->"/></symbol>
  <symbol id="icon-android" viewBox="0 0 24 24"><path d="<!--ANDROID-->"/></symbol>
  <symbol id="icon-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.2L4.6 18.4A2 2 0 0 0 6.3 21.5h11.4a2 2 0 0 0 1.7-3.1L14 9.2V3M7.5 15h9"/></symbol>
  <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
</svg>
<main>
  <header>
    <a class="brand" href="/releases/<!--OTHER-->/" title="<!--OTHERGAME--> tablosuna geç" aria-label="<!--OTHERGAME--> tablosuna geç">
      <img src="<!--LOGO-->" alt="">
      <div>
        <p class="eyebrow" lang="en"><!--GAME--></p>
        <h1 lang="en">Release Summary</h1>
        <p class="meta">Reflex tarafından düzenli aralıklarla güncellenir · Son güncelleme <strong><!--UPDATED--></strong></p>
      </div>
      <span class="brand-swap" aria-hidden="true">⇄</span>
    </a>
  </header>
  <div class="legend">
    <span><span class="dot live"></span>Yayında</span>
    <span><span class="dot past"></span>Artık yayında değil</span>
    <span><svg class="flask"><use href="#icon-flask"/></svg>Test / Prod'a açılmadı</span>
    <span><svg class="os apple"><use href="#icon-apple"/></svg>iOS</span>
    <span><svg class="os android"><use href="#icon-android"/></svg>Android</span>
    <span>👊🏻&nbsp;Forcelandı</span>
    <span><svg class="ext" style="margin:0 6px 0 0;opacity:1"><use href="#icon-external"/></svg>Sürüm → Slack release postu</span>
  </div>
  <div class="card"><div class="scroll">
<!--TABLE-->
  </div></div>
</main>
</body>
</html>
