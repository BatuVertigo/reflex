<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Catalog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234a3aa7'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #0f141b;
  --ink-2: #5b6573;
  --ink-3: #8a94a3;
  --hairline: #e3e7ee;
  --focus: #2a78d6;
  --accent: #4a3aa7;
  --accent-soft: #ecebfa;
  --font-display: "Archivo", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0e12; --surface: #141920; --surface-2: #1a2029; --ink: #eef1f5; --ink-2: #aab3c0; --ink-3: #6f7a88;
    --hairline: #242b35; --focus: #3987e5; --accent: #9085e9; --accent-soft: #221f3d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0b0e12; --surface: #141920; --surface-2: #1a2029; --ink: #eef1f5; --ink-2: #aab3c0; --ink-3: #6f7a88;
  --hairline: #242b35; --focus: #3987e5; --accent: #9085e9; --accent-soft: #221f3d;
}

* { box-sizing: border-box; }
html { background: var(--ground); scroll-padding-top: 130px; }
body { margin: 0; padding: 28px 20px 56px; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
main { width: min(1180px, 100%); margin: 0 auto; }

header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.mark { flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: var(--accent); box-shadow: 0 1px 2px rgba(15, 20, 27, 0.12); }
.mark svg { width: 34px; height: 34px; fill: #fff; }
header .eyebrow { margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
header h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-stretch: 62%; font-variation-settings: "wdth" 62; font-size: 40px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
header .meta { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; }
header .meta strong { color: var(--ink); font-weight: 600; }

/* Search and section chips stay on screen while the tables scroll under them. */
.toolbar { position: sticky; top: 0; z-index: 2; margin: 0 -20px 8px; padding: 12px 20px 10px; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search input { width: 100%; height: 46px; padding: 0 52px 0 42px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; box-shadow: 0 1px 2px rgba(15, 20, 27, 0.05); }
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); padding: 1px 7px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--surface-2); color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; }
.search input:not(:placeholder-shown) + kbd { display: none; }  /* the browser's clear button takes its place */
.chips { position: relative; display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--hairline); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; transition: background 120ms ease, color 120ms ease, border-color 120ms ease; }
.chip span { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); }
.chip.active span { color: var(--accent); }
.chip.none { opacity: 0.45; }

section { margin-top: 26px; }
section[hidden] { display: none; }
h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; padding: 0 4px; font-family: var(--font-display); font-weight: 800; font-stretch: 75%; font-variation-settings: "wdth" 75; font-size: 22px; letter-spacing: 0.01em; text-transform: uppercase; }
h2 .count { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink-3); }

.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: 0 1px 2px rgba(15, 20, 27, 0.05), 0 12px 32px -24px rgba(15, 20, 27, 0.25); overflow: hidden; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
thead th { background: var(--surface-2); padding: 11px 16px; text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--hairline); }
thead th:first-child { width: 290px; }
tbody td { padding: 12px 16px; vertical-align: top; border-bottom: 1px solid var(--hairline); color: var(--ink-2); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr[hidden] { display: none; }
td strong { color: var(--ink); font-weight: 600; }
td code { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; padding: 1px 5px; border-radius: 5px; background: var(--surface-2); color: var(--ink); overflow-wrap: anywhere; }
td:first-child code { display: inline-block; padding: 3px 8px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent); cursor: copy; transition: filter 120ms ease; }
td:first-child code:hover { filter: brightness(0.96); }
td a { color: var(--focus); }

.empty { margin: 40px 0; text-align: center; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 3; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--ground); font-size: 13px; font-weight: 500; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  html { scroll-padding-top: 130px; }
  body { padding: 18px 16px 40px; font-size: 13.5px; }
  .toolbar { margin: 0 -16px 8px; padding: 10px 16px 8px; }
  .search kbd { display: none; }
  .mark { width: 48px; height: 48px; } .mark svg { width: 26px; height: 26px; }
  header h1 { font-size: 30px; }
  /* Two columns do not fit a phone: each skill becomes a small block, name above its description. */
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tbody tr { padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
  tbody tr:last-child { border-bottom: 0; }
  tbody td { padding: 0; border: 0; }
  tbody td:first-child { margin-bottom: 6px; }
  tbody tr:hover td { background: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></div>
    <div>
      <p class="eyebrow" lang="en">Vertigo AI</p>
      <h1 lang="en">Skill Catalog</h1>
      <p class="meta">Reflex tarafından düzenli aralıklarla güncellenir · Son güncelleme <strong><!--UPDATED--></strong> · <strong><!--TOTAL--></strong> skill</p>
    </div>
  </header>
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="query" type="search" placeholder="Skill adı veya ne yaptığı ile ara…" aria-label="Skill ara" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <nav class="chips" aria-label="Bölümler">
<!--CHIPS-->
    </nav>
  </div>
<!--SECTIONS-->
  <p class="empty" id="no-match" hidden>Eşleşen skill yok.</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const query = document.getElementById("query");
  const sections = [...document.querySelectorAll("section")];
  const chips = new Map([...document.querySelectorAll(".chip")].map(chip => [chip.dataset.section, chip]));
  const normalize = text => text.toLocaleLowerCase("tr");

  function filter() {
    const words = normalize(query.value).split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const section of sections) {
      let count = 0;
      for (const row of section.querySelectorAll("tbody tr")) {
        const text = normalize(row.textContent);
        const match = words.every(word => text.includes(word));
        row.hidden = !match;
        if (match) count++;
      }
      section.hidden = count === 0;
      section.querySelector(".count").textContent = count;
      const chip = chips.get(section.id);
      if (chip) {
        chip.querySelector("span").textContent = count;
        chip.classList.toggle("none", count === 0);
      }
      shown += count;
    }
    document.getElementById("no-match").hidden = shown > 0;
    spy();
  }
  query.addEventListener("input", filter);
  addEventListener("pageshow", filter);  // the browser may restore the last search on back/reload

  // "/" jumps to the search box from anywhere on the page; Escape clears it.
  document.addEventListener("keydown", event => {
    if (event.key === "/" && document.activeElement !== query) { event.preventDefault(); query.focus(); }
    if (event.key === "Escape" && document.activeElement === query) { query.value = ""; filter(); }
  });

  // Clicking a skill name copies it, ready to paste into Claude.
  const toast = document.getElementById("toast");
  let toastTimer;
  document.addEventListener("click", async event => {
    const code = event.target.closest("td:first-child code");
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code.textContent);
      toast.textContent = `${code.textContent} kopyalandı`;
    } catch (error) {
      // The page is plain http on the office network, where navigator.clipboard does not exist: use the old copy command.
      const scratch = document.createElement("textarea");
      scratch.value = code.textContent;
      document.body.append(scratch);
      scratch.select();
      toast.textContent = document.execCommand("copy") ? `${code.textContent} kopyalandı` : "Kopyalanamadı";
      scratch.remove();
    }
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  });

  // The chip of the section at the top of the screen lights up (the last section whose heading passed under the toolbar).
  let spyFrame;
  function spy() {
    const line = document.querySelector(".toolbar").getBoundingClientRect().bottom + 140;
    let current;
    for (const section of sections) {
      if (!section.hidden && section.getBoundingClientRect().top <= line) current = section.id;
    }
    chips.forEach((chip, id) => chip.classList.toggle("active", id === current));
    // Scroll only the chip row: scrollIntoView on a chip inside the sticky toolbar also scrolls the page back to the top.
    const chip = current && chips.get(current);
    if (chip) {
      const row = chip.parentElement;
      if (chip.offsetLeft < row.scrollLeft || chip.offsetLeft + chip.offsetWidth > row.scrollLeft + row.clientWidth) {
        row.scrollTo({ left: chip.offsetLeft - 16, behavior: "smooth" });
      }
    }
  }
  addEventListener("scroll", () => { cancelAnimationFrame(spyFrame); spyFrame = requestAnimationFrame(spy); }, { passive: true });
  spy();
</script>
</body>
</html>
