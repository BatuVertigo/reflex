<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats</title>
<script>
  // A returning visitor goes straight to the last game picked here (each game page saves it); a first visit sees the cards.
  try {
    const game = localStorage.getItem("stats-game");
    const paths = { polygun: "/stats/pa/", cs: "/stats/cs/" };
    if (paths[game]) location.replace(paths[game]);
  } catch (error) {
    // Storage blocked: show the cards.
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #f3f5f8;
  --surface: #fbfcfd;
  --ink: #10151c;
  --ink-2: #4a5360;
  --hairline: #e0e4ea;
  --focus: #2a78d6;
  --polygun: #4a3aa7;
  --cs: #9a6b00;
  --font-display: "Archivo", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0e12;
    --surface: #151920;
    --ink: #eef1f5;
    --ink-2: #b6bdc7;
    --hairline: #242a33;
    --focus: #3987e5;
    --polygun: #9085e9;
    --cs: #e8b53c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0b0e12;
  --surface: #151920;
  --ink: #eef1f5;
  --ink-2: #b6bdc7;
  --hairline: #242a33;
  --focus: #3987e5;
  --polygun: #9085e9;
  --cs: #e8b53c;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--ground); color: var(--ink); font-family: var(--font-body); }
main { width: min(720px, 100%); display: grid; gap: 28px; justify-items: center; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-stretch: 62%; font-variation-settings: "wdth" 62; font-size: 44px; text-transform: uppercase; letter-spacing: 0.02em; }
p { margin: 0; color: var(--ink-2); }
.releases a { color: var(--focus); }
.games { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.game { display: grid; justify-items: center; gap: 14px; padding: 28px 20px 24px; background: var(--surface); border: 1px solid var(--hairline); border-top: 4px solid var(--accent); border-radius: 14px; color: var(--ink); text-decoration: none; transition: transform 120ms ease, box-shadow 120ms ease; }
.game:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16, 21, 28, 0.12); }
.game:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.game img { width: 120px; height: 120px; }
.game strong { font-family: var(--font-display); font-weight: 900; font-stretch: 62%; font-variation-settings: "wdth" 62; font-size: 30px; line-height: 1; text-align: center; text-transform: uppercase; color: var(--accent); }
.polygun { --accent: var(--polygun); }
.cs { --accent: var(--cs); }
@media (max-width: 520px) { .games { grid-template-columns: minmax(0, 1fr); } .game img { width: 88px; height: 88px; } }
</style>
</head>
<body>
<main>
  <h1>Stats</h1>
  <p>Pick a game. The page remembers it for next time; click the logo to switch.</p>
  <div class="games">
    <a class="game polygun" href="/stats/pa/"><img src="/stats/pa/logo-web.png" alt=""><strong>Polygun<br>Arena</strong></a>
    <a class="game cs" href="/stats/cs/"><img src="/stats/cs/logo-web.png" alt=""><strong>Critical<br>Strike</strong></a>
  </div>
  <p class="releases">Release tables: <a href="/releases/pa/">Polygun Arena</a> · <a href="/releases/cs/">Critical Strike</a></p>
</main>
</body>
</html>
