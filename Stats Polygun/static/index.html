<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Polygun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #edf0f3;
  --surface: #fbfcfd;
  --ink: #10151c;
  --ink-2: #4a5360;
  --muted: #68717e;
  --hairline: #e0e4ea;
  --baseline: #c2c9d2;
  --band: #f0f2f5;
  --wash: rgba(16, 21, 28, 0.07);
  --win: #2a78d6;
  --loss: #e34948;
  --draw: #848b96;
  --on-win: #ffffff;
  --on-loss: #ffffff;
  --on-draw: #10151c;
  --accent: #4a3aa7;
  --on-accent: #ffffff;
  --rarity-1: #a79fe0;
  --rarity-2: #8d82d4;
  --rarity-3: #7466c6;
  --rarity-4: #5b4db5;
  --rarity-5: #45389c;
  --rarity-6: #32287a;
  --tip-bg: #ffffff;
  --tip-border: rgba(16, 21, 28, 0.12);
  --tip-shadow: 0 8px 28px rgba(16, 21, 28, 0.14);
  --focus: #2a78d6;
  --font-display: "Archivo", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0e12;
    --surface: #151920;
    --ink: #eef1f5;
    --ink-2: #b6bdc7;
    --muted: #8b94a1;
    --hairline: #242a33;
    --baseline: #3b434e;
    --band: #1a1f27;
    --wash: rgba(238, 241, 245, 0.08);
    --win: #3987e5;
    --loss: #e66767;
    --draw: #939aa5;
    --on-win: #0b0e12;
    --on-loss: #0b0e12;
    --on-draw: #0b0e12;
    --accent: #9085e9;
    --on-accent: #0b0e12;
    --rarity-1: #4b40a3;
    --rarity-2: #5f53bb;
    --rarity-3: #7568d2;
    --rarity-4: #8c81e2;
    --rarity-5: #a59cee;
    --rarity-6: #c1baf5;
    --tip-bg: #1f242c;
    --tip-border: rgba(255, 255, 255, 0.12);
    --tip-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    --focus: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0b0e12;
  --surface: #151920;
  --ink: #eef1f5;
  --ink-2: #b6bdc7;
  --muted: #8b94a1;
  --hairline: #242a33;
  --baseline: #3b434e;
  --band: #1a1f27;
  --wash: rgba(238, 241, 245, 0.08);
  --win: #3987e5;
  --loss: #e66767;
  --draw: #939aa5;
  --on-win: #0b0e12;
  --on-loss: #0b0e12;
  --on-draw: #0b0e12;
  --accent: #9085e9;
  --on-accent: #0b0e12;
  --rarity-1: #4b40a3;
  --rarity-2: #5f53bb;
  --rarity-3: #7568d2;
  --rarity-4: #8c81e2;
  --rarity-5: #a59cee;
  --rarity-6: #c1baf5;
  --tip-bg: #1f242c;
  --tip-border: rgba(255, 255, 255, 0.12);
  --tip-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  --focus: #3987e5;
}

* { box-sizing: border-box; }
/* The artifact host adds this rule itself; the Mac's http.server does not, and .samples/.tooltip set display, which would beat the browser's own hidden rule. */
[hidden] { display: none !important; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 20px;
  padding-block: 24px 72px;
  -webkit-font-smoothing: antialiased;
}
p, h1, h2, h3, ul { margin: 0; }
ul { padding: 0; list-style: none; }
/* --topbar and --period-bar are measured by main.js: the sticky bars need their heights for the rail offset and anchor jumps. */
.page { max-width: 1360px; margin-inline: auto; display: grid; gap: 16px; --topbar: 0px; --period-bar: 0px; }
.page > *, .content > *, #player-top > *, #report > *, .zone-period > * { min-width: 0; }
#player-top, #report, .content { display: grid; gap: 16px; }
/* The period host has no box of its own, so the sticky period bar sticks within the whole Period zone, cards included. */
#period-top { display: contents; }
@media (min-width: 960px) {
  .page { grid-template-columns: 232px minmax(0, 1fr); column-gap: 28px; align-items: start; }
  .topbar { grid-column: 1 / -1; position: sticky; top: 0; z-index: 6; background: var(--ground); }
  .rail { position: sticky; top: var(--topbar); max-height: calc(100vh - var(--topbar)); overflow-y: auto; padding-bottom: 24px; }
  .content { max-width: 1100px; }
}

.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 22px; padding-block: 10px; border-bottom: 1px solid var(--hairline); }
.brand { display: flex; align-items: center; gap: 8px 12px; }
.brand-logo { width: 36px; height: 36px; flex: none; }
.wordmark {
  font-family: var(--font-display);
  font-weight: 900;
  font-stretch: 62%;
  font-variation-settings: "wdth" 62;
  font-size: 26px;
  line-height: 0.9;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  white-space: nowrap;
}
.wordmark span { color: var(--accent); }
.pill {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  border: 1px solid var(--baseline);
  border-radius: 999px;
  padding: 2px 9px;
}
.search { flex: 0 1 540px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search input {
  flex: 1 1 260px;
  min-width: 0;
  text-align: center;
  font-family: var(--font-data);
  font-size: 16px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--baseline);
  border-radius: 8px;
  padding: 10px 12px;
}
.search input::placeholder { text-transform: none; letter-spacing: 0; color: var(--muted); }
.search input:focus-visible, .search button:focus-visible, .chip-button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.search button {
  font: inherit;
  font-weight: 600;
  color: var(--on-accent);
  background: var(--accent);
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
}
.chip-button {
  font: inherit;
  font-size: 13px;
  white-space: nowrap;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 4px 11px;
  cursor: pointer;
}
.chip-button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); }
.chip-button code { font-family: var(--font-data); font-size: 12px; }
/* Loading and error text: its own centered line under the search, gone when empty so the bar stays 64 px. */
.status { flex: 1 1 100%; text-align: center; font-size: 13.5px; color: var(--ink-2); }
.status:empty { display: none; }
/* One request at a time: while it runs, the report, the picker, the strip and the player list are dimmed and inert. */
.page[aria-busy="true"] #report, .page[aria-busy="true"] .period-bar, .page[aria-busy="true"] #career-strip { opacity: 0.55; pointer-events: none; }
.search input:disabled, .search button:disabled, .chip-button:disabled, .rail-player:disabled { opacity: 0.6; cursor: wait; }

/* Rail: the players, then two group heads in the page's title face; the Period head carries its section links as subheads. */
.rail { display: grid; gap: 18px; align-content: start; font-size: 13.5px; }
.rail-group { display: grid; gap: 2px; }
.rail-label { padding: 0 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.rail-head, .rail-sub { display: flex; align-items: center; gap: 8px; text-decoration: none; border-left: 2px solid transparent; border-radius: 0 6px 6px 0; }
.rail-head {
  font-family: var(--font-display);
  font-weight: 900;
  font-stretch: 62%;
  font-variation-settings: "wdth" 62;
  font-size: 20px;
  line-height: 1;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--ink-2);
  padding: 6px 10px;
}
.rail-group.is-active .rail-head { color: var(--ink); }
.rail-sub { color: var(--ink-2); font-weight: 500; padding: 5px 10px 5px 24px; }
.rail-head:hover, .rail-sub:hover { color: var(--ink); background: var(--wash); }
.rail-head:focus-visible, .rail-sub:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.rail-sub[aria-current="true"] { color: var(--ink); font-weight: 600; background: var(--surface); border-left-color: var(--accent); }
.rail-icon { width: 16px; height: 16px; flex: none; fill: var(--accent); }
.rail-sub .rail-icon { width: 13px; height: 13px; fill: var(--muted); }
.rail-sub[aria-current="true"] .rail-icon, .rail-sub:hover .rail-icon { fill: var(--ink); }
.rail-players { display: grid; gap: 4px; }
.rail-player { display: grid; gap: 1px; width: 100%; text-align: left; font: inherit; font-size: 13.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.rail-player:hover { color: var(--ink); border-color: var(--baseline); }
.rail-player:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.rail-player[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); font-weight: 600; }
.rail-player code { font-family: var(--font-data); font-size: 11.5px; font-weight: 400; color: var(--muted); }
@media (max-width: 959px) {
  .rail { gap: 10px; }
  .rail-group, .rail-players { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .rail-label { padding: 0; min-width: 64px; }
  .rail-head { padding: 4px 8px 4px 0; border-left: 0; color: var(--ink); }
  .rail-sub, .rail-player { display: inline-flex; align-items: center; gap: 6px; width: auto; font-size: 13px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 11px; }
  .rail-sub[aria-current="true"] { border-color: var(--ink); background: var(--surface); }
}

/* The Period zone holds the sticky period bar and every Period card, so the bar sticks for the whole group. */
.zone-period { display: grid; gap: 16px; }
.zone-period .group-title { color: var(--accent); }

.player { display: grid; gap: 8px; padding-block: 6px 2px; }
.player-name {
  font-family: var(--font-display);
  font-weight: 900;
  font-stretch: 62%;
  font-variation-settings: "wdth" 62;
  font-size: clamp(48px, 9vw, 88px);
  line-height: 0.86;
  text-transform: uppercase;
}
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: var(--font-data); font-size: 12.5px; color: var(--ink-2); }

.scoreboard {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--hairline);
  border: 1px solid var(--hairline);
  border-radius: 10px;
  overflow: hidden;
}
.stat { background: var(--surface); padding: 18px 20px 20px; display: grid; align-content: start; gap: 6px; }
.stat-label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.stat-sub { font-size: 13.5px; color: var(--ink-2); }
.record-bar { display: flex; gap: 2px; height: 8px; margin-block: 4px 2px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 20px 22px 22px;
  display: grid;
  align-content: start;
  gap: 16px;
  min-width: 0;
}
.panel-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
details.panel { display: block; }
details.panel > summary { position: relative; padding-right: 40px; list-style: none; cursor: pointer; border-radius: 6px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
details.panel:not([open]) > summary .lede,
details.panel:not([open]) > summary .legend { display: none; }
.card-arrow { position: absolute; top: 0; right: 0; width: 28px; height: 28px; fill: var(--ink-2); transition: transform 160ms ease; }
details.panel[open] > summary .card-arrow { transform: rotate(180deg); }
details.panel > summary:hover .card-arrow { fill: var(--ink); }
.panel-body { display: grid; gap: 16px; margin-top: 16px; min-width: 0; }
@media (prefers-reduced-motion: reduce) {
  .card-arrow { transition: none; }
}
.panel h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-stretch: 62%;
  font-variation-settings: "wdth" 62;
  font-size: 30px;
  line-height: 1;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-wrap: balance;
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel h3 { font-size: 14px; font-weight: 600; line-height: 1.3; }
.title-icon { width: 0.8em; height: 0.8em; flex: none; fill: var(--accent); }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 28px 2px; border-top: 1px solid var(--baseline); }
.group-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-stretch: 62%;
  font-variation-settings: "wdth" 62;
  font-size: 48px;
  line-height: 0.9;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 12px;
}
.group-lede { flex: 1 1 100%; font-size: 14px; color: var(--ink-2); max-width: 70ch; }
.scope {
  font-family: var(--font-data);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
  border: 1px solid var(--baseline);
  border-radius: 999px;
  padding: 1px 8px;
  white-space: nowrap;
}
.scope-period { color: var(--accent); border-color: var(--accent); }
.period-bar { position: sticky; top: calc(var(--topbar) + 8px); z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; box-shadow: 0 6px 18px rgba(16, 21, 28, 0.08); }
.period-presets { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.preset-group { display: flex; flex-wrap: wrap; gap: 6px; }
.period-dates { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--ink-2); }
.period-dates input { font-family: var(--font-data); font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--baseline); border-radius: 8px; padding: 5px 8px; }
.period-dates input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.period-summary { flex: 1 1 100%; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.career-strip svg { cursor: pointer; }
.strip-bar { fill: var(--muted); fill-opacity: 0.55; }
.period-band { fill: var(--accent); fill-opacity: 0.12; }
.key-ink-line { width: 16px; height: 2px; border-radius: 2px; background: var(--ink-2); }
.key-muted { background: var(--muted); opacity: 0.55; }
.key-period { background: var(--accent); opacity: 0.3; }
.panel[id], .panel h2[id], .group-head, .scoreboard[id] { scroll-margin-top: calc(var(--topbar) + 16px); }
.zone-period .panel[id], .zone-period .panel h2[id] { scroll-margin-top: calc(var(--topbar) + var(--period-bar) + 24px); }
.lede { font-size: 14px; color: var(--ink-2); margin-top: 6px; max-width: 70ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; flex: none; }
.key-rect { width: 12px; height: 12px; border-radius: 3px; }
.key-dot { width: 10px; height: 10px; border-radius: 50%; }
.key-dot-small { width: 6px; height: 6px; }
.key-glyph { width: 10px; height: 10px; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.key-win, .seg-win, .chip-win { background: var(--win); }
.key-loss, .seg-loss, .chip-loss { background: var(--loss); }
.key-draw, .seg-draw, .chip-draw { background: var(--draw); }
.key-accent { background: var(--accent); }
.key-hollow { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--muted); }
.key-version { width: 2px; height: 12px; background: var(--ink-2); }
.key-search { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: 0.6; }
.key-line { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
.buckets { max-width: 720px; }
.search-dot { fill: var(--muted); fill-opacity: 0.55; }
.search-dot-active { fill: var(--ink); fill-opacity: 1; stroke: var(--surface); stroke-width: 2; }
.search-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }

.form-strip { display: flex; flex-wrap: wrap; gap: 16px 24px; border-radius: 6px; }
.day { display: grid; gap: 6px; align-content: start; max-width: 100%; }
.day-head { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.day-name { font-weight: 600; }
.day-record { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chip {
  width: 20px;
  height: 26px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-family: var(--font-data);
  font-size: 11px;
  font-weight: 600;
  user-select: none;
}
.chip-win { color: var(--on-win); }
.chip-loss { color: var(--on-loss); }
.chip-draw { color: var(--on-draw); }
.chip.is-active { outline: 2px solid var(--ink); outline-offset: 2px; }
.streaks { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 13.5px; color: var(--ink-2); }
.streaks strong { color: var(--ink); font-weight: 600; }

.chart-scroll { overflow-x: auto; }
.chart { min-width: 560px; }
.scrub { border-radius: 6px; }
.scrub:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.chart-svg { display: block; }
.chart-svg text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.chart-svg .band-label { font-size: 10px; letter-spacing: 0.04em; }
.chart-svg .day-label { fill: var(--ink-2); font-weight: 500; }
.chart-svg .label-strong { fill: var(--ink); font-weight: 600; }
.chart-svg .ref-label { fill: var(--ink-2); }
.chart-svg .version-label { fill: var(--ink); font-weight: 600; font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.chart-svg .row-label, .chart-svg .track-label { font-family: var(--font-body); font-size: 12px; fill: var(--ink-2); }
.chart-svg .cell-label { font-size: 10px; fill: var(--ink); pointer-events: none; }
.chart-svg .cell-label-on { fill: var(--on-accent); }
.band { fill: transparent; }
.band-alt { fill: var(--band); }
.grid { stroke: var(--hairline); stroke-width: 1; }
.axis-base, .day-rule { stroke: var(--baseline); stroke-width: 1; }
.version-rule { stroke: var(--ink-2); stroke-width: 1; }
.lp-line { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot { stroke: var(--surface); stroke-width: 2; }
.dot-start { fill: var(--surface); stroke: var(--ink-2); stroke-width: 2; }
.dot-win, .bar-win { fill: var(--win); }
.dot-loss, .bar-loss { fill: var(--loss); }
.dot-draw, .bar-draw { fill: var(--draw); }
.mark-glyph { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.hit { fill: transparent; }
.cursor-line { stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
.cursor-halo { fill: none; stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.column-wash { fill: var(--wash); pointer-events: none; }
.ref-even { stroke: var(--baseline); stroke-width: 1; }
.ref-average { stroke: var(--ink-2); stroke-width: 1; }
.break { stroke: var(--surface); stroke-width: 3; }
.bar-accent, .heat { fill: var(--accent); }
.cell-empty { fill: var(--band); }
.track { fill: var(--surface); stroke: var(--baseline); stroke-width: 1; }
.track-trial { fill: var(--band); }
.no-data { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; gap: 16px; }
.pair > details:not([open]) { align-self: start; }
